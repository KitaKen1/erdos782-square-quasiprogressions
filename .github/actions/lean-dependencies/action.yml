name: Prepare pinned Lean dependencies
description: Install Lean and restore the pinned Mathlib, Stacks and Mordell outputs
inputs:
  seed-run-ids:
    description: Space-delimited earlier parallel runs supplying dependency outputs
    default: ''
  swap-gib:
    description: Size of additional swap in GiB on the Linux runner
    default: '20'
outputs:
  public-cache-hit:
    description: Whether the pinned public cache was found in GitHub Actions storage
    value: ${{ steps.public-cache.outputs.cache-hit }}
  public-cache-key:
    description: Expected GitHub Actions cache key for the public seed
    value: ${{ steps.public-cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - shell: bash
      name: Install elan
      run: |
        installer="$RUNNER_TEMP/erdos782-elan-init.sh"
        curl --proto '=https' --tlsv1.2 -fsSL https://elan.lean-lang.org/elan-init.sh -o "$installer"
        sh "$installer" -y --default-toolchain none --no-modify-path
        echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
    - shell: bash
      name: Check runner resources
      env:
        EXTRA_SWAP_GIB: ${{ inputs.swap-gib }}
      run: |
        [[ "$EXTRA_SWAP_GIB" == '20' || "$EXTRA_SWAP_GIB" == '32' ]]
        if ! command -v zstd >/dev/null; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi
        df -h /
        free -h
        available=$(df -PB1 / | awk 'NR==2 {print $4}')
        swap=$(awk '/SwapTotal:/ {print $2}' /proc/meminfo)
        if (( available >= (EXTRA_SWAP_GIB + 45) * 1024**3 && swap < 16 * 1024**2 )); then
          sudo fallocate -l "${EXTRA_SWAP_GIB}G" /var/tmp/lean-ci.swap
          sudo chmod 600 /var/tmp/lean-ci.swap
          sudo mkswap /var/tmp/lean-ci.swap
          sudo swapon /var/tmp/lean-ci.swap || printf 'Runner swap could not be enabled.\n'
        fi
    - shell: bash
      name: Fetch pinned Mathlib outputs
      working-directory: lean
      run: lake exe cache get Mathlib
    - uses: actions/cache/restore@v6
      id: single-run-cache
      if: inputs.seed-run-ids != ''
      with:
        path: |
          lean/.lake/packages/Stacks/.lake/build
          lean/.lake/packages/Mordell/.lake/build
        key: fc782-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          fc782-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('lean/lean-toolchain', 'lean/lake-manifest.json') }}-
    - uses: actions/cache/restore@v6
      id: public-cache
      if: steps.single-run-cache.outputs.cache-matched-key == ''
      with:
        path: |
          lean/.lake/packages/Stacks/.lake/build
          lean/.lake/packages/Mordell/.lake/build
        key: fc782-public-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('verification/axiom-cache.json') }}
    - shell: bash
      name: Restore the pinned public cache if needed
      if: steps.single-run-cache.outputs.cache-matched-key == '' && steps.public-cache.outputs.cache-hit != 'true'
      run: bash verification/restore-axiom-cache.sh
    - shell: bash
      name: Restore compiler outputs from earlier parallel runs
      if: inputs.seed-run-ids != ''
      env:
        SEED_RUN_IDS: ${{ inputs.seed-run-ids }}
        GH_TOKEN: ${{ github.token }}
      run: |
        read -r -a seed_runs <<< "$SEED_RUN_IDS"
        for seed_run in "${seed_runs[@]}"; do
          [[ "$seed_run" =~ ^[1-9][0-9]*$ ]]
          directory="$RUNNER_TEMP/lean-seed/$seed_run"
          gh run download "$seed_run" --repo "$GITHUB_REPOSITORY" --pattern 'fc782-wave-*' --dir "$directory"
          bash "$GITHUB_WORKSPACE/verification/restore-shards.sh" 7 "$directory"
        done
